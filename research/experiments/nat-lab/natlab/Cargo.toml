[package]
name = "natlab"
version = "0.1.0"
edition = "2024"
publish = false

# Built inside WSL Ubuntu with CARGO_TARGET_DIR=/root/natlab-target (see ../README.md).

[dependencies]
anyhow = "1"
iroh = { version = "=1.2.0", features = ["unstable-net-report", "unstable-custom-transports"] }
iroh-relay = { version = "=1.2.0", features = ["server"] }
instant-acme = "0.8"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
n0-future = "0.3"
n0-watcher = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
futures = "0.3"
nfq = "0.2"
libc = "0.2"

[profile.release]
debug = false
opt-level = 3
