[package]
name = "e9_webrtcrs"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
webrtc = "0.21.0"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
