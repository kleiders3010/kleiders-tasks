[package]
name = "e9_libp2p"
version = "0.1.0"
edition = "2024"

[dependencies]
libp2p = { version = "0.57", default-features = false, features = ["tokio", "quic", "relay", "dcutr", "identify", "autonat", "kad", "noise", "yamux", "tcp", "macros", "ed25519"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
