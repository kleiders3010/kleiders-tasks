[package]
name = "e6_size"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
hkdf = "0.13.0"
iroh = { version = "1.2.0", optional = true }
loro = { version = "1.16.2", optional = true }
nostr = { version = "0.45", optional = true, features = ["std", "rand", "os-rng"] }
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

[features]
loro = ["dep:loro"]
iroh = ["dep:iroh"]
nostr = ["dep:nostr"]

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
